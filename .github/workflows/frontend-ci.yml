name: Frontend CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_PUBLIC_API_BASE_URL: https://dakh-backend.onrender.com/api/public/v1
          VITE_PUBLIC_HOTEL_SLUG: dakh
          VITE_BOOKING_ENABLED: "false"
      - name: Verify Pages entry files
        run: test -f frontend/dist/index.html && test -f frontend/dist/404.html
